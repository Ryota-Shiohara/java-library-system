name: Java CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Detect production sources
        id: source_check
        shell: bash
        run: |
          production_source="$(find src/main/java -type f -name '*.java' -print -quit)"
          if [[ -n "$production_source" ]]; then
            echo "has_sources=true" >> "$GITHUB_OUTPUT"
            echo "Production Java sources found."
          else
            echo "has_sources=false" >> "$GITHUB_OUTPUT"
            echo "No production Java sources found. CI is skipped until implementation is added."
          fi

      - name: Download JUnit launcher
        if: steps.source_check.outputs.has_sources == 'true'
        shell: bash
        run: |
          mkdir -p lib
          curl --fail --silent --show-error --location \
            "https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/6.1.1/junit-platform-console-standalone-6.1.1.jar" \
            --output "lib/junit-platform-console-standalone-6.1.1.jar"

      - name: Compile and run JUnit tests
        if: steps.source_check.outputs.has_sources == 'true'
        shell: bash
        run: bash ./scripts/test.sh

      - name: Upload JUnit reports
        if: always() && steps.source_check.outputs.has_sources == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: junit-test-reports
          path: out/test-reports
          if-no-files-found: ignore
