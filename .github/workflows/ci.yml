name: Java CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Detect production sources
        id: source_check
        shell: pwsh
        run: |
          $sources = @(Get-ChildItem -LiteralPath "src/main/java" -Recurse -File -Filter "*.java" -ErrorAction SilentlyContinue)
          if ($sources.Count -eq 0) {
            "has_sources=false" >> $env:GITHUB_OUTPUT
            Write-Host "No production Java sources found. CI is skipped until implementation is added."
          }
          else {
            "has_sources=true" >> $env:GITHUB_OUTPUT
            Write-Host "Found $($sources.Count) production source file(s)."
          }

      - name: Download JUnit launcher
        if: steps.source_check.outputs.has_sources == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force lib | Out-Null
          Invoke-WebRequest `
            -Uri "https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/6.1.1/junit-platform-console-standalone-6.1.1.jar" `
            -OutFile "lib/junit-platform-console-standalone-6.1.1.jar"

      - name: Compile and run JUnit tests
        if: steps.source_check.outputs.has_sources == 'true'
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Upload JUnit reports
        if: always() && steps.source_check.outputs.has_sources == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: junit-test-reports
          path: out/test-reports
          if-no-files-found: ignore
